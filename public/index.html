<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#18212b;--panel:#222d3a;--ink:#eef0f2;--mute:#8fa0b3;--lt:#e9dfc4;--dk:#5f8576;--acc:#e4a93b;--line:#34445a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Georgia,'Iowan Old Style',serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:24px;letter-spacing:.5px}#on{color:var(--mute);font-size:14px}
.hide{display:none!important}
main{max-width:980px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:20px}.card p{margin:0;color:var(--mute);font-size:14px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px 12px;background:#141b24;color:var(--ink)}
button{background:var(--acc);color:#241a05;font-weight:600;border:0;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#namebox{max-width:340px}
#game{display:flex;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
#left{width:min(92vw,560px)}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:4px solid #0e141b;border-radius:4px;overflow:hidden;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;container-type:size}
.lt{background:var(--lt)}.dk{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(228,169,59,.45)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(228,169,59,.8)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(214,60,60,.65)}
.sq.tg::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(20,27,36,.35);position:absolute}
.pc{font-size:80cqmin;line-height:1}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}
.pc.b{color:#1a1a1a;text-shadow:0 0 1px #777}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-weight:600}
.clock{font:600 20px ui-monospace,monospace;background:var(--panel);padding:4px 10px;border-radius:6px;min-width:76px;text-align:center}
.clock.on{background:var(--acc);color:#241a05}
#side{width:min(92vw,280px);display:flex;flex-direction:column;gap:12px}
#status{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;font-weight:600;min-height:48px}
#moves{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;height:230px;overflow:auto;font:14px ui-monospace,monospace;display:grid;grid-template-columns:30px 1fr 1fr;gap:2px 6px;align-content:start}
#moves span:nth-child(3n+1){color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.8);display:flex;align-items:center;justify-content:center;z-index:9}
.ov>div{background:var(--panel);padding:24px;border-radius:10px;text-align:center;max-width:90vw}
.promo button{font-size:34px;margin:4px;background:var(--lt);color:#111}
</style></head><body>
<header><h1>♞ Chess Arena</h1><span id="on"></span></header>
<main>
<section id="home">
  <div id="namebox"><label for="name">Your name</label><input id="name" maxlength="16" placeholder="Enter a name"></div>
  <div class="grid">
    <div class="card"><h2>Play online</h2><p>Get matched with a random player.</p>
      <select id="tc"><option value="0">Casual (no clock)</option><option value="1">Bullet 1 min</option><option value="3">Blitz 3+2</option><option value="5" selected>Blitz 5 min</option><option value="10">Rapid 10 min</option></select>
      <button id="q">Find opponent</button></div>
    <div class="card"><h2>Play a friend</h2><p>Make a room and share the code.</p>
      <button id="mk">Create room</button>
      <div class="row"><input id="code" maxlength="4" placeholder="CODE"><button class="alt" id="jn">Join</button></div></div>
    <div class="card"><h2>Vs computer</h2><p>Practice on your own.</p>
      <div class="row"><select id="lvl"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select>
      <select id="side2"><option value="w">White</option><option value="b">Black</option></select></div>
      <button id="ai">Start</button></div>
    <div class="card"><h2>Pass and play</h2><p>Two players, one screen.</p><button id="loc">Start</button></div>
  </div>
</section>
<section id="game" class="hide">
  <div id="left">
    <div class="bar"><span id="topn"></span><span class="clock" id="topc"></span></div>
    <div id="board"></div>
    <div class="bar"><span id="botn"></span><span class="clock" id="botc"></span></div>
  </div>
  <div id="side"><div id="status"></div><div id="moves"></div>
    <div class="row"><button class="alt" id="draw">Offer draw</button><button class="alt" id="res">Resign</button></div>
    <button id="exit">Leave game</button></div>
</section>
</main>
<div id="wait" class="ov hide"><div><p id="wt"></p><button class="alt" id="cancel">Cancel</button></div></div>
<div id="promo" class="ov promo hide"><div></div></div>
<script>
const $=s=>document.querySelector(s);
const G={mode:null,chess:new Chess(),color:'w',sel:null,last:null,over:false,names:{w:'',b:''},hist:[],clock:null,at:0,msg:'',lvl:2,busy:false};
const P={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
const myName=()=>{const n=$('#name').value.trim()||'Guest';localStorage.cn=n;return n};
$('#name').value=localStorage.cn||'';

/* ---------- network ---------- */
let ws;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='online')$('#on').textContent=m.n+' online';
    else if(m.t==='wait')wait('Looking for an opponent…');
    else if(m.t==='room')wait('Room code: '+m.code+'\nShare it with your friend.');
    else if(m.t==='err')alert(m.m);
    else if(m.t==='start'){$('#wait').classList.add('hide');G.mode='online';G.color=m.color;G.names=m.names;G.over=false;G.sel=null;G.msg='';show(true);}
    else if(m.t==='state'){G.chess.load(m.fen);G.last=m.last;G.hist=m.hist;G.clock=m.tc?m.clock:null;G.at=Date.now();G.over=m.over;G.msg=m.over?m.reason:'';render();}
    else if(m.t==='draw'&&confirm('Your opponent offers a draw. Accept?'))tx({t:'accept'});
  };
  ws.onclose=()=>setTimeout(connect,2000);
  ws.onopen=()=>{};
}
const tx=o=>{o.name=myName();ws&&ws.readyState===1?ws.send(JSON.stringify(o)):alert('Connecting… try again in a moment.')};
setInterval(()=>ws&&ws.readyState===1&&ws.send('{"t":"ping"}'),20000);
connect();
function wait(t){$('#wt').innerText=t;$('#wait').classList.remove('hide')}

/* ---------- screens ---------- */
function show(g){$('#home').classList.toggle('hide',g);$('#game').classList.toggle('hide',!g);render()}
$('#q').onclick=()=>tx({t:'queue',tc:$('#tc').value});
$('#mk').onclick=()=>tx({t:'create',tc:$('#tc').value});
$('#jn').onclick=()=>tx({t:'join',code:$('#code').value});
$('#cancel').onclick=()=>{tx({t:'leave'});$('#wait').classList.add('hide')};
$('#loc').onclick=()=>{local('local','w',{w:'White',b:'Black'})};
$('#ai').onclick=()=>{G.lvl=+$('#lvl').value;const c=$('#side2').value,n=myName();
  local('ai',c,c==='w'?{w:n,b:'Computer'}:{w:'Computer',b:n});if(c==='b')setTimeout(aiTurn,300)};
function local(mode,color,names){G.mode=mode;G.chess=new Chess();G.color=color;G.names=names;G.over=false;G.sel=null;G.last=null;G.hist=[];G.clock=null;G.msg='';show(true)}
$('#exit').onclick=()=>{if(G.mode==='online')tx({t:'leave'});G.mode=null;G.chess=new Chess();show(false)};
$('#res').onclick=()=>{if(G.over)return;if(G.mode==='online'){confirm('Resign?')&&tx({t:'resign'})}else{G.over=true;G.msg='Game ended';render()}};
$('#draw').onclick=()=>{if(G.over)return;if(G.mode==='online'){tx({t:'offer'});alert('Draw offer sent.')}else{G.over=true;G.msg='Draw by agreement';render()}};

/* ---------- board ---------- */
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function kingSq(c){const b=G.chess.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p&&p.type==='k'&&p.color===c)return 'abcdefgh'[f]+(8-r)}}
function render(){
  const c=G.chess,flip=G.color==='b',el=$('#board');el.innerHTML='';
  const tg=G.sel?c.moves({square:G.sel,verbose:true}).map(m=>m.to):[];
  const chk=c.in_check()?kingSq(c.turn()):null;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rr=flip?7-r:r,ff=flip?7-f:f,sq='abcdefgh'[ff]+(8-rr),d=document.createElement('div');
    d.className='sq '+((rr+ff)%2?'dk':'lt');
    if(G.sel===sq)d.classList.add('sel');
    if(G.last&&(G.last.from===sq||G.last.to===sq))d.classList.add('last');
    if(sq===chk)d.classList.add('chk');
    if(tg.includes(sq))d.classList.add('tg');
    const p=c.get(sq);if(p){const s=document.createElement('span');s.className='pc '+p.color;s.textContent=P[p.type];d.append(s)}
    d.onclick=()=>click(sq);el.append(d);
  }
  const top=flip?'w':'b',bot=flip?'b':'w';
  $('#topn').textContent=G.names[top];$('#botn').textContent=G.names[bot];
  const h=G.mode==='online'?G.hist:c.history();
  $('#moves').innerHTML=h.map((m,i)=>(i%2?'':`<span>${i/2+1}.</span>`)+`<span>${m}</span>`).join('');
  $('#moves').scrollTop=1e5;
  let s;
  if(G.over)s=G.msg||endText();else s=(c.turn()==='w'?G.names.w:G.names.b)+"'s turn"+(c.in_check()?' — check!':'');
  $('#status').textContent=s;tick();
  $('#draw').classList.toggle('hide',G.mode==='ai');
}
function endText(){const c=G.chess;if(c.in_checkmate())return (c.turn()==='w'?G.names.b:G.names.w)+' wins by checkmate';return 'Draw'}
function tick(){
  for(const [id,col] of [['#topc',G.color==='w'?'b':'w'],['#botc',G.color]]){
    const e=$(id);e.classList.toggle('hide',!G.clock);if(!G.clock)continue;
    const act=!G.over&&G.chess.turn()===col;
    e.textContent=fmt(G.clock[col]-(act?Date.now()-G.at:0));e.classList.toggle('on',act);
  }
}
setInterval(tick,200);

function canMove(){if(G.over||G.busy)return false;
  if(G.mode==='online'||G.mode==='ai')return G.chess.turn()===G.color;return G.mode==='local'}
function click(sq){
  if(!canMove())return;
  const c=G.chess;
  if(G.sel&&c.moves({square:G.sel,verbose:true}).some(m=>m.to===sq)){const from=G.sel;G.sel=null;return tryMove(from,sq)}
  const p=c.get(sq);G.sel=p&&p.color===c.turn()?sq:null;render();
}
function tryMove(from,to){
  const p=G.chess.get(from);
  if(p.type==='p'&&(to[1]==='8'||to[1]==='1')){
    const box=$('#promo>div');box.innerHTML='<p>Promote to</p>';
    for(const t of ['q','r','b','n']){const b=document.createElement('button');b.textContent=P[t];
      b.onclick=()=>{$('#promo').classList.add('hide');play(from,to,t)};box.append(b)}
    $('#promo').classList.remove('hide');
  }else play(from,to,'q');
}
function play(from,to,promo){
  if(G.mode==='online'){tx({t:'move',from,to,promotion:promo});G.sel=null;return}
  const m=G.chess.move({from,to,promotion:promo});if(!m)return render();
  G.last={from,to};afterMove();
  if(G.mode==='ai'&&!G.over)setTimeout(aiTurn,250);
}
function afterMove(){if(G.chess.game_over()){G.over=true;G.msg=''}render()}

/* ---------- computer ---------- */
const V={p:100,n:320,b:330,r:500,q:900,k:0};
function ev(c){let s=0;c.board().forEach((row,r)=>row.forEach((p,f)=>{if(p){
  const ctr=3.5-Math.max(Math.abs(r-3.5),Math.abs(f-3.5));
  s+=(p.color==='w'?1:-1)*(V[p.type]+(p.type==='p'||p.type==='n'?ctr*6:0))}}));return s}
const order=ms=>ms.sort((a,b)=>(b.captured?1:0)-(a.captured?1:0));
function search(c,d,a,b){
  if(c.in_checkmate())return c.turn()==='w'?-1e5-d:1e5+d;
  if(c.game_over())return 0;
  if(d===0)return ev(c);
  const w=c.turn()==='w';let best=w?-1e9:1e9;
  for(const m of order(c.moves({verbose:true}))){
    c.move(m);const v=search(c,d-1,a,b);c.undo();
    if(w){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);b=Math.min(b,v)}
    if(b<=a)break;
  }return best}
function aiTurn(){
  G.busy=true;render();
  setTimeout(()=>{
    const c=G.chess,w=c.turn()==='w';let best=null,bv=w?-1e9:1e9;
    for(const m of order(c.moves({verbose:true}))){
      c.move(m);const v=search(c,G.lvl-1,-1e9,1e9)+Math.random()*(G.lvl===1?150:8);c.undo();
      if(w?v>bv:v<bv){bv=v;best=m}
    }
    G.busy=false;
    if(best){c.move({from:best.from,to:best.to,promotion:'q'});G.last={from:best.from,to:best.to}}
    afterMove();
  },50);
}
</script></body></html>
